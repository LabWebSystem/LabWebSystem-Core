name: LabWebSystem Core Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "既存のRelease対象タグ"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/labwebsystem

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          case "$release_tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "invalid release tag: $release_tag" >&2; exit 1 ;;
          esac
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.version.outputs.version }}

      - name: Publish Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/dashboard:${{ steps.version.outputs.version }}

      - name: Prepare Release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          manifest_version="$(node -p "require('./release.json').labWebSystemVersion")"
          test "$version" = "$manifest_version"
          mkdir -p release-assets
          cp release.json release-assets/release.json
          cp infra/compose/compose.production.yml release-assets/compose.production.yml
          cp infra/compose/Caddyfile.production release-assets/Caddyfile.production

          expected_sha="$(node -p "require('./release.json').compose.sha256")"
          actual_sha="$(sha256sum release-assets/compose.production.yml | awk '{print \$1}')"
          test "$expected_sha" = "$actual_sha"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" release-assets/release.json release-assets/compose.production.yml release-assets/Caddyfile.production \
            --repo "$GITHUB_REPOSITORY" \
            --title "LabWebSystem Core $GITHUB_REF_NAME" \
            --generate-notes
