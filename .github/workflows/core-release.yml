name: LabWebSystem Core Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "検証済み release tag"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/labwebsystem

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/backend:${{ steps.version.outputs.version }}

      - name: Publish Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/compose/Dockerfile.dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAMESPACE }}/dashboard:${{ steps.version.outputs.version }}

      - name: Prepare Release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          cp infra/compose/compose.yaml release-assets/compose.yaml
          sha256="$(sha256sum release-assets/compose.yaml | awk '{print $1}')"
          jq -n \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg sha256 "$sha256" \
            '{manifestVersion: 1, version: $version, minimumLwsctlVersion: "0.1.0", artifacts: {compose: {name: "compose.yaml", sha256: $sha256}}}' \
            > release-assets/release.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release-assets/release.json release-assets/compose.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --title "LabWebSystem Core ${{ steps.version.outputs.tag }}" \
            --generate-notes
