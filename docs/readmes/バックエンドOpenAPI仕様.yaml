openapi: 3.1.0
info:
  title: Lab-Core Backend API
  version: 0.1.0
  summary: 現行 backend 実装に合わせた OpenAPI 仕様
  description: |
    `core/backend` の現行 Hono 実装をもとに整理した OpenAPI 仕様です。
    一部のレスポンスは compose 解析結果やダッシュボードレイアウトのように動的構造を含むため、
    `additionalProperties` や `object` を使って現行実装の柔軟性を維持しています。
servers:
  - url: http://localhost:7300
    description: ローカル開発環境
tags:
  - name: Meta
  - name: System
  - name: Applications
  - name: Jobs
  - name: Events
  - name: Infrastructure
  - name: Logs
  - name: Testing
paths:
  /health:
    get:
      tags: [Meta]
      summary: ヘルスチェック
      operationId: getHealth
      responses:
        '200':
          description: backend の基本ヘルス
          content:
            application/json:
              schema:
                type: object
                required: [ok, timestamp]
                properties:
                  ok:
                    type: boolean
                    const: true
                  timestamp:
                    type: string
                    format: date-time
  /api:
    get:
      tags: [Meta]
      summary: API メタ情報を取得
      operationId: getApiMeta
      responses:
        '200':
          description: API 情報
          content:
            application/json:
              schema:
                type: object
                required: [service, version, timestamp, openapi]
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  openapi:
                    type: object
                    required: [jsonUrl, yamlUrl]
                    properties:
                      jsonUrl:
                        type: string
                      yamlUrl:
                        type: string
  /api/openapi.json:
    get:
      tags: [Meta]
      summary: OpenAPI JSON を取得
      operationId: getOpenApiJson
      responses:
        '200':
          description: OpenAPI JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/openapi.yaml:
    get:
      tags: [Meta]
      summary: OpenAPI YAML を取得
      operationId: getOpenApiYaml
      responses:
        '200':
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/system/status:
    get:
      tags: [System]
      summary: システム状態を取得
      operationId: getSystemStatus
      responses:
        '200':
          description: システム状態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
  /api/system/metrics:
    get:
      tags: [System]
      summary: システムメトリクスを取得
      operationId: getSystemMetrics
      responses:
        '200':
          description: CPU、メモリ、ディスク、ネットワーク、アラート
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMetricsResponse'
  /api/system/dashboard-layout:
    get:
      tags: [System]
      summary: 保存済みダッシュボードレイアウトを取得
      operationId: getDashboardLayout
      parameters:
        - $ref: '#/components/parameters/DashboardIdQuery'
        - $ref: '#/components/parameters/UserIdQuery'
      responses:
        '200':
          description: レイアウト取得結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardLayoutResponse'
    put:
      tags: [System]
      summary: ダッシュボードレイアウトを保存
      operationId: putDashboardLayout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardLayoutPutRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardLayoutPutResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
  /api/applications:
    get:
      tags: [Applications]
      summary: アプリ一覧を取得
      operationId: listApplications
      responses:
        '200':
          description: アプリ一覧
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationListItem'
    post:
      tags: [Applications]
      summary: アプリを登録して初回デプロイを開始
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCreatedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictMessage'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/applications/import/resolve:
    post:
      tags: [Applications]
      summary: GitHub URL から登録候補を解決
      operationId: resolveApplicationImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveImportRequest'
      responses:
        '200':
          description: 解決成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveImportResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/applications/import/compose-inspect:
    post:
      tags: [Applications]
      summary: リモート repository の compose を解析
      operationId: inspectRemoteCompose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectComposeRequest'
      responses:
        '200':
          description: 解析結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeInspection'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/applications/{applicationId}:
    get:
      tags: [Applications]
      summary: アプリ詳細を取得
      operationId: getApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: アプリ詳細
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetailResponse'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
    delete:
      tags: [Applications]
      summary: アプリ削除ジョブを開始
      operationId: deleteApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteApplicationRequest'
      responses:
        '202':
          description: 削除ジョブを開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/deployment/inspect:
    post:
      tags: [Applications]
      summary: 既存アプリの compose 設定候補を解析
      operationId: inspectApplicationDeployment
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectLocalComposeRequest'
      responses:
        '200':
          description: 解析結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeInspection'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
  /api/applications/{applicationId}/deployment:
    patch:
      tags: [Applications]
      summary: デプロイ設定を更新
      operationId: updateApplicationDeployment
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeploymentRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDeploymentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/applications/{applicationId}/restart:
    post:
      tags: [Applications]
      summary: 再起動ジョブを開始
      operationId: restartApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/stop:
    post:
      tags: [Applications]
      summary: 停止ジョブを開始
      operationId: stopApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/resume:
    post:
      tags: [Applications]
      summary: 再開ジョブを開始
      operationId: resumeApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/rebuild:
    post:
      tags: [Applications]
      summary: 再ビルドジョブを開始
      operationId: rebuildApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildApplicationRequest'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildAcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/update-check:
    post:
      tags: [Applications]
      summary: 更新確認ジョブを開始
      operationId: checkApplicationUpdate
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/update:
    post:
      tags: [Applications]
      summary: 更新適用ジョブを開始
      operationId: updateApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/applications/{applicationId}/rollback:
    post:
      tags: [Applications]
      summary: ロールバックジョブを開始
      operationId: rollbackApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '202':
          description: ジョブ開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ActiveJobConflict'
  /api/jobs:
    get:
      tags: [Jobs]
      summary: ジョブ一覧を取得
      operationId: listJobs
      parameters:
        - $ref: '#/components/parameters/LimitJobs'
      responses:
        '200':
          description: ジョブ一覧
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
  /api/jobs/{jobId}/retry:
    post:
      tags: [Jobs]
      summary: 失敗ジョブを再実行
      operationId: retryJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 再実行開始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/JobConflictResponse'
  /api/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: 待機中ジョブをキャンセル
      operationId: cancelJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: キャンセル成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionAcceptedResponse'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ConflictMessage'
  /api/jobs/{jobId}/delete:
    post:
      tags: [Jobs]
      summary: 完了済みジョブを削除
      operationId: deleteJobViaPost
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ConflictMessage'
  /api/jobs/{jobId}:
    delete:
      tags: [Jobs]
      summary: 完了済みジョブを削除
      operationId: deleteJob
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobActionAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequestMessage'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '409':
          $ref: '#/components/responses/ConflictMessage'
  /api/events:
    get:
      tags: [Events]
      summary: イベント一覧を取得
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/LimitEvents'
        - $ref: '#/components/parameters/ApplicationIdQuery'
      responses:
        '200':
          description: イベント一覧
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemEvent'
  /api/infrastructure/sync:
    post:
      tags: [Infrastructure]
      summary: DNS と Proxy 設定を同期
      operationId: syncInfrastructure
      parameters:
        - name: reason
          in: query
          required: false
          schema:
            type: string
            default: manual
      responses:
        '200':
          description: 同期結果
          content:
            application/json:
              schema:
                type: object
                required: [message, executionMode]
                properties:
                  message:
                    type: string
                  executionMode:
                    $ref: '#/components/schemas/ExecutionMode'
                  changed:
                    type: boolean
                  generatedFiles:
                    type: array
                    items:
                      type: string
                  proxyConfigPath:
                    type: string
                  dnsHostsPath:
                    type: string
                additionalProperties: true
  /api/logs/{applicationId}/services:
    get:
      tags: [Logs]
      summary: ログ取得対象サービス一覧を取得
      operationId: listApplicationLogServices
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: サービス一覧
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, services]
                properties:
                  applicationId:
                    type: string
                  services:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/logs/{applicationId}:
    get:
      tags: [Logs]
      summary: アプリログを取得
      operationId: getApplicationLogs
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: service
          in: query
          required: false
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 20
            maximum: 1000
            default: 200
      responses:
        '200':
          description: ログ取得結果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationLogSnapshot'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundMessage'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/testing/registration-fixtures:
    get:
      tags: [Testing]
      summary: 登録テスト用 fixture を取得
      operationId: listRegistrationFixtures
      responses:
        '200':
          description: fixture 一覧
          content:
            application/json:
              schema:
                type: object
                required: [fixtures]
                properties:
                  fixtures:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationFixture'
components:
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    DashboardIdQuery:
      name: dashboardId
      in: query
      required: false
      schema:
        type: string
        default: operations-monitoring
    UserIdQuery:
      name: userId
      in: query
      required: false
      schema:
        type: string
        default: default
    LimitJobs:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LimitEvents:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 300
        default: 100
    ApplicationIdQuery:
      name: applicationId
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequestMessage:
      description: 入力不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ConflictMessage:
      description: 競合
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    NotFoundMessage:
      description: 対象なし
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    InternalError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: バリデーションエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ActiveJobConflict:
      description: 実行中または待機中のジョブがあるため競合
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActiveJobConflictResponse'
    JobConflictResponse:
      description: ジョブ競合
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/MessageResponse'
              - $ref: '#/components/schemas/ActiveJobConflictResponse'
  schemas:
    ExecutionMode:
      type: string
      enum: [dry-run, execute]
    ApplicationStatus:
      type: string
      enum:
        - Draft
        - Cloning
        - Build Pending
        - Deploying
        - Running
        - Degraded
        - Stopped
        - Failed
        - Rebuilding
        - Deleting
    DeploymentMode:
      type: string
      enum: [standard, headless]
    EventLevel:
      type: string
      enum: [info, warning, error]
    JobType:
      type: string
      enum:
        - clone
        - build
        - deploy
        - stop
        - resume
        - rebuild
        - delete
        - update-check
        - update
        - rollback
        - restart
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    DeleteMode:
      type: string
      enum: [config_only, source_and_config, full]
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            detail:
              type: string
    ValidationIssue:
      type: object
      properties:
        code:
          type: string
        path:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        message:
          type: string
      additionalProperties: true
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            issues:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
    ActiveJobRef:
      type: object
      properties:
        job_id:
          type: string
        type:
          $ref: '#/components/schemas/JobType'
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: true
    ActiveJobConflictResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          required: [activeJob]
          properties:
            activeJob:
              $ref: '#/components/schemas/ActiveJobRef'
    ApplicationHealth:
      type: object
      required:
        - state
        - severity
        - summary
        - checked_at
        - url
        - http_status
        - response_time_ms
        - reachable
        - container_summary
        - detail
      properties:
        state:
          type: string
          enum: [healthy, slow, page_error, runtime_error, unreachable, pending, stopped, unknown]
        severity:
          type: string
          enum: [ok, warning, critical, inactive, unknown]
        summary:
          type: string
        checked_at:
          type: string
          format: date-time
        url:
          type: string
          nullable: true
        http_status:
          type: integer
          nullable: true
        response_time_ms:
          type: integer
          nullable: true
        reachable:
          type: boolean
          nullable: true
        detail:
          type: string
          nullable: true
        container_summary:
          type: object
          required: [total, healthy, warning, critical, unknown]
          properties:
            total:
              type: integer
