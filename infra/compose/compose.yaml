name: labwebsystem

services:
  backend:
    image: "ghcr.io/labwebsystem/backend:${LWS_VERSION:?LWS_VERSION is required}"
    restart: unless-stopped
    environment:
      LAB_CORE_VERSION: "${LWS_VERSION}"
      LAB_CORE_INSTALLATION_ID: "${LWS_INSTALLATION_ID}"
      LAB_CORE_ROOT_DOMAIN: "${LWS_PRIMARY_DOMAIN:?LWS_PRIMARY_DOMAIN is required}"
      LAB_CORE_DATA_DIRECTORY: /var/lib/labwebsystem
      LAB_CORE_DB_PATH: /var/lib/labwebsystem/database/database.sqlite
      LAB_CORE_APPS_ROOT: /var/lib/labwebsystem/apps
      LAB_CORE_APPDATA_ROOT: /var/lib/labwebsystem/appdata
      LAB_CORE_SYNC_DIR: /var/lib/labwebsystem/generated
      LAB_CORE_PROXY_CONFIG_PATH: /var/lib/labwebsystem/generated/Caddyfile
      LAB_CORE_DNS_HOSTS_PATH: /var/lib/labwebsystem/generated/fukaya-sus.hosts
      LAB_CORE_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - "${LWS_DATA_DIR:?LWS_DATA_DIR is required}:/var/lib/labwebsystem"
      - "${LWS_DATA_DIR:?LWS_DATA_DIR is required}/database:/var/lib/labwebsystem/database"
      - "${LWS_DATA_DIR:?LWS_DATA_DIR is required}/apps:/var/lib/labwebsystem/apps"
      - "${LWS_DATA_DIR:?LWS_DATA_DIR is required}/appdata:/var/lib/labwebsystem/appdata"
      - "${LWS_DATA_DIR:?LWS_DATA_DIR is required}/generated:/var/lib/labwebsystem/generated"
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [labwebsystem]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7300/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard:
    image: "ghcr.io/labwebsystem/dashboard:${LWS_VERSION:?LWS_VERSION is required}"
    restart: unless-stopped
    ports:
      - "${LWS_HTTP_BIND:-0.0.0.0:80}:80/tcp"
    depends_on:
      backend:
        condition: service_healthy
    networks: [labwebsystem]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  labwebsystem: {}
