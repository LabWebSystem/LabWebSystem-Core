x-labcore-node-tools: &labcore-node-tools
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile.dev-node-tools
  image: labcore-dev-node-tools:latest

x-labcore-host-user-env: &labcore-host-user-env
  HOME: /tmp/labcore-home
  XDG_CACHE_HOME: /tmp/labcore-cache
  COREPACK_HOME: /tmp/labcore-corepack
  YARN_CACHE_FOLDER: /tmp/labcore-yarn-cache
  npm_config_cache: /tmp/labcore-npm-cache

services:
  deps:
    <<: *labcore-node-tools
    working_dir: ${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
    command: sh -lc "node scripts/dev/sync-workspace-deps.mjs"
    volumes:
      - ${LAB_CORE_HOST_PROJECT_ROOT:-../../}:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
      - labcore_node_modules:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}/node_modules

  backend:
    <<: *labcore-node-tools
    working_dir: ${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
    user: ${LAB_CORE_HOST_UID:-1000}:${LAB_CORE_HOST_GID:-1000}
    command: sh -lc "corepack yarn service:backend:up"
    restart: unless-stopped
    volumes:
      - ${LAB_CORE_HOST_PROJECT_ROOT:-../../}:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
      - labcore_node_modules:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${LAB_CORE_DOCKER_SOCKET_GID:-0}"
    environment:
      <<: *labcore-host-user-env
    ports:
      - "7300:7300"

  dashboard:
    <<: *labcore-node-tools
    working_dir: ${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
    user: ${LAB_CORE_HOST_UID:-1000}:${LAB_CORE_HOST_GID:-1000}
    command: sh -lc "corepack yarn workspace @lab-core/dashboard build && corepack yarn workspace @lab-core/dashboard preview --host 0.0.0.0 --port 4173"
    restart: unless-stopped
    volumes:
      - ${LAB_CORE_HOST_PROJECT_ROOT:-../../}:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}
      - labcore_node_modules:${LAB_CORE_HOST_PROJECT_ROOT:-/workspace}/node_modules
    environment:
      <<: *labcore-host-user-env
      VITE_DEV_PROXY_TARGET: "http://backend:7300"
    depends_on:
      - backend
    ports:
      - "5173:4173"

volumes:
  labcore_node_modules:
