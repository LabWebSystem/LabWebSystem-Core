name: labcore-dev-proxy

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LAB_CORE_PROXY_HTTP_BIND:-127.0.0.1:80}:80/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ../../core/backend/data/generated:/data/generated:ro
    networks:
      - default
      - kernel

networks:
  kernel:
    name: labcore-kernel
    external: true
